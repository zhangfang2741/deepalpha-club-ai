"app/services/chan/*.py" = ["D415", "D101", "D102"]
"app/schemas/chan.py" = ["D415", "D101"]
"app/services/skills/kline.py" = ["D415"]
"tests/services/skills/test_kline_fetch.py" = ["D415"]
"tests/services/chan/*.py" = ["D415", "D101", "D102", "D103", "D104"]
"app/api/v1/chan.py" = ["D415"]
"app/core/langgraph/tools/chan_analysis.py" = ["D415"]
"app/core/langgraph/tools/fmp_data.py" = ["D415"]
"app/core/langgraph/graph.py" = ["D415"]
"app/core/prompts/__init__.py" = ["D415"]
"app/api/v1/chatbot.py" = ["D415"]
"app/schemas/chat.py" = ["D415"]
"app/api/v1/settings.py" = ["D415"]
"app/services/model_preference.py" = ["D415"]
"app/services/institutional_signals/*.py" = ["D415", "D101", "D104"]
"app/schemas/institutional_signals.py" = ["D415", "D101"]
"app/models/signal_snapshot.py" = ["D415"]
"app/models/vocabulary.py" = ["D415"]
"app/schemas/vocabulary.py" = ["D415"]
