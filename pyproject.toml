# 共享验证码模块与其测试：中文 docstring 以「。」结尾，D415 不适用
"app/services/verification_code.py" = ["D415"]
"tests/services/test_verification_code.py" = ["D415"]
"tests/services/test_email_brand.py" = ["D415"]
"app/services/account/*.py" = ["D415", "D104"]
"tests/services/account/*.py" = ["D415", "D103", "D104"]
"tests/api/*.py" = ["D415", "D103", "D104"]
"tests/utils/test_password_strength.py" = ["D415"]
