"app/api/v1/supply_chain.py" = ["D415"]
"alembic/versions/*.py" = ["D415"]
"scripts/*.py" = ["D415"]
"app/api/v1/industry_panic.py" = ["D415", "D101"]
"app/services/industry_panic/*.py" = ["D415", "D101", "D104"]
"app/cache/client.py" = ["D415"]
"app/cache/operations.py" = ["D415"]
"app/schemas/research.py" = ["D415"]
"app/services/research.py" = ["D415"]
"app/api/v1/research.py" = ["D415"]
"app/services/wyckoff/*.py" = ["D415", "D101"]
